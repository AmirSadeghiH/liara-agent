[project]
name = "liarapilot"
version = "0.1.0"
description = "LiaraPilot AI Engineer - an AI infrastructure engineer for Liara-hosted applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LiaraPilot Team" }]
dependencies = [
    "fastapi==0.160.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.1.6",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain-openai==1.7.2",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[project.scripts]
liarapilot = "app.main:run"
liarapilot-mcp = "app.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "live: tests that require a real Liara account / token (skipped by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["data", "app/demo_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
