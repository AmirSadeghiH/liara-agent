{# Inline SVG icon set — no external assets, works offline. 24×24, stroke = currentColor. #}
{% macro icon(name, size=18, cls='') -%}
<svg class="ico{% if cls %} {{ cls }}{% endif %}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {%- if name == 'overview' -%}
    <rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/>
    <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>
  {%- elif name == 'projects' -%}
    <rect x="3" y="4" width="18" height="6.5" rx="2"/><rect x="3" y="13.5" width="18" height="6.5" rx="2"/>
    <path d="M7 7.25h.01M7 16.75h.01M11 7.25h4M11 16.75h4"/>
  {%- elif name == 'diagnose' -%}
    <path d="M3 12h3.6l2.4-6 3.4 12 2.6-6H21"/>
  {%- elif name == 'workflows' -%}
    <circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/>
    <path d="M6 8.4v3.1A3.5 3.5 0 0 0 9.5 15h4.1A3.4 3.4 0 0 1 17 17"/><path d="M15.6 3.4 18 5.8l-2.4 2.4"/>
  {%- elif name == 'approvals' -%}
    <path d="M12 3.2 19 6v5.6c0 4.4-2.9 7.3-7 9.2-4.1-1.9-7-4.8-7-9.2V6z"/><path d="m8.9 11.9 2.1 2.1 4.1-4.1"/>
  {%- elif name == 'settings' -%}
    <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>
  {%- elif name == 'mcp' -%}
    <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7.5 10 2.6 2.6-2.6 2.6M13 15.2h4"/>
  {%- elif name == 'docs' -%}
    <path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14.5V19a1.8 1.8 0 0 1-1.8 1.8H5A1.8 1.8 0 0 1 3.2 19V7.8A1.8 1.8 0 0 1 5 6h4.5"/>
  {%- elif name == 'play' -%}
    <path d="M8.5 5.6 18 12l-9.5 6.4z" fill="currentColor" stroke="none"/>
  {%- elif name == 'refresh' -%}
    <path d="M20 11a8 8 0 1 0-2.6 5.9"/><path d="M20 4.5V11h-6.3"/>
  {%- elif name == 'close' -%}
    <path d="m6 6 12 12M18 6 6 18"/>
  {%- elif name == 'copy' -%}
    <rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.2"/>
    <path d="M15.5 5.2A1.7 1.7 0 0 0 13.9 3.5H5.7A2.2 2.2 0 0 0 3.5 5.7v8.2c0 .9.7 1.6 1.6 1.6"/>
  {%- elif name == 'check' -%}
    <path d="m5 12.5 4.6 4.6L19 7.5"/>
  {%- elif name == 'alert' -%}
    <path d="M12 4.5 21 19.5H3z"/><path d="M12 9.7v4.1M12 16.9h.01"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3 1.8"/>
  {%- elif name == 'arrow-left' -%}
    <path d="M19 12H5"/><path d="m10.5 6.5-5 5.5 5 5.5"/>
  {%- elif name == 'arrow-right' -%}
    <path d="M5 12h14"/><path d="m13.5 6.5 5 5.5-5 5.5"/>
  {%- elif name == 'cpu' -%}
    <rect x="7" y="7" width="10" height="10" rx="2"/>
    <path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>
  {%- elif name == 'memory' -%}
    <rect x="3.2" y="7" width="17.6" height="10" rx="2.2"/><path d="M7 10.4v3.2M11 10.4v3.2M15 10.4v3.2"/>
    <path d="M7 17v3M17 17v3"/>
  {%- elif name == 'rocket' -%}
    <path d="M13.5 4.6c3-1 5.4-.8 6 .1.7.8.7 3.1-.4 5.9-1.2 3.1-3.7 5.5-7 6.7l-3.3-3.3c1.2-3.3 3.5-5.7 6.6-7"/>
    <path d="M9.2 14.3 5 18.5"/><path d="M8.5 9.4 4.7 10l-1.6 3.3 4.2.9M14.6 15.5l.6 3.8 3.3-1.6.9-4.2"/>
    <circle cx="15.6" cy="8.4" r="1.5"/>
  {%- elif name == 'spark' -%}
    <path d="M12 3.5 13.7 9l5.5 1.7-5.5 1.7L12 18l-1.7-5.6L4.8 10.7 10.3 9z"/><path d="M18.5 16.5l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h11"/>
  {%- elif name == 'lock' -%}
    <rect x="4.5" y="10" width="15" height="10.5" rx="2.4"/><path d="M8 10V7.4a4 4 0 0 1 8 0V10"/><path d="M12 14.2v2.4"/>
  {%- elif name == 'shield' -%}
    <path d="M12 3.2 19 6v5.6c0 4.4-2.9 7.3-7 9.2-4.1-1.9-7-4.8-7-9.2V6z"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="6.6"/><path d="m16 16 4.5 4.5"/>
  {%- elif name == 'server' -%}
    <rect x="3" y="4" width="18" height="6.5" rx="2"/><rect x="3" y="13.5" width="18" height="6.5" rx="2"/>
    <path d="M7 7.25h.01M7 16.75h.01"/>
  {%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.2M12 8h.01"/>
  {%- elif name == 'zap' -%}
    <path d="M13.2 3 5.5 13.4h5.6L10.8 21l7.7-10.4h-5.6z"/>
  {%- elif name == 'book' -%}
    <path d="M4 5.6A2.6 2.6 0 0 1 6.6 3H19v15.5H6.6A2.6 2.6 0 0 0 4 21z"/><path d="M19 18.5v2.5"/>
  {%- elif name == 'inbox' -%}
    <path d="M4.6 5h14.8l2.1 8.6V19H2.5v-5.4z"/><path d="M2.6 13.4h4.6l1.4 2.3h6.8l1.4-2.3h4.6"/>
  {%- elif name == 'user' -%}
    <circle cx="12" cy="8.4" r="3.9"/><path d="M4.6 20.4a7.4 7.4 0 0 1 14.8 0"/>
  {%- endif -%}
</svg>
{%- endmacro %}
